[package]
name = "heartwood-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Heartwood: Duress-Aware Shielded Zcash Wallet"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
sha2 = "0.10"
blake2b_simd = "1.0"
bip39 = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
thiserror = "2.0"
zcash_primitives = "0.30"
zcash_protocol = "0.10"
zcash_keys = "0.16"
zcash_address = "0.13"
zip32 = "0.2"
orchard = "0.15"
sapling-crypto = "0.7"

[dev-dependencies]
tempfile = "3.17"
